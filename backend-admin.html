<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Chat AI - Backend Admin</title>
    <meta name="description" content="Backend admin for Hotel Chat AI system.">
    <link rel="stylesheet" href="output.css">
    <link rel="icon" href="/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <style>
        html {
            scroll-behavior: smooth;
        }

        @tailwind base;
        @tailwind components;
        @tailwind utilities;

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .animate-fadeIn {
            animation: fadeIn 2s ease-in-out;
        }

        .copy-tooltip {
            position: relative;
            display: inline-block;
        }

        .copy-tooltip .tooltiptext {
            visibility: hidden;
            width: 100px;
            background-color: rgba(107, 33, 168, 0.9);
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -50px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .copy-tooltip .tooltiptext::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: rgba(107, 33, 168, 0.9) transparent transparent transparent;
        }

        .copy-tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }

        /* Responsive button and text sizes for various screen widths */
        @media (min-width: 1024px) {
            .button-lg {
                padding: 0.75rem 2.5rem;
                font-size: 1.25rem;
            }

            .text-balance {
                font-size: 1.25rem;
            }

            .title-lg {
                font-size: 3.5rem;
            }
        }

        @media (max-width: 1024px) {
            .button-lg {
                padding: 0.75rem 1.5rem;
                font-size: 1.125rem;
            }

            .text-balance {
                font-size: 1.125rem;
            }

            .title-lg {
                font-size: 2.75rem;
            }

            /* Ensure the navigation bar items stack correctly */
            .navbar-items {
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                gap: 5rem;
            }
        }

        @media (max-width: 768px) {
            .button-lg {
                padding: 0.75rem 1rem;
                font-size: 1rem;
            }

            .text-balance {
                font-size: 1rem;
            }

            .title-lg {
                font-size: 2.25rem;
            }

            /* Navbar responsive adjustments */
            .navbar-items {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.75rem;
                margin-top: 1rem;
            }

            .navbar-items a {
                display: block;
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body class="font-sans antialiased bg-black text-white" style="font-family: 'Inter', sans-serif;">

    <!-- Header -->
    <div class="w-full max-w-5xl mx-auto px-6">
        <nav class="w-full py-4 flex flex-row items-center gap-2 sm:gap-8">
            <a href="/" class="flex items-center font-bold tracking-tight">
                <img src="logo.png" alt="Logo" class='w-12 h-12'>
                <span class="text-lg text-violet-500 ml-2">Hotel Chat AI</span>
            </a>

            <div class='flex-1'></div>

            <a href="/#features" class="hidden md:block text-violet-500 font-medium hover:underline underline-offset-2 hover:decoration-violet-500/50">Features</a>
            <a href="/pricing" class="hidden md:block text-violet-500 font-medium hover:underline underline-offset-2 hover:decoration-violet-500/50">Pricing</a>
        </nav>
    </div>
    
    <!-- API Content -->
    <div class="px-6 py-16 w-full max-w-xl mx-auto">
        <h1 class="text-3xl font-bold mb-10 text-center text-violet-500">Backend API</h1>
        
        <div class="p-8 bg-gray-900 rounded-lg mb-10 shadow-lg">
            <h2 class="text-xl font-semibold mb-6 text-fuchsia-400">create-bot-secret</h2>
            
            <form id="create-bot-form">
                <div class="mb-6">
                    <label class="block text-sm font-medium mb-2">Password</label>
                    <input type="password" id="password" class="bg-gray-800 text-white rounded-md px-4 py-3 w-full" placeholder="Enter password">
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-medium mb-2">Bot (comma-separated for multiple)</label>
                    <input type="text" id="bot" class="bg-gray-800 text-white rounded-md px-4 py-3 w-full" placeholder="Enter bot name or names">
                </div>
                
                <button id="submit-btn" type="submit" class="w-full mt-6 px-6 py-3 bg-fuchsia-400 text-white rounded-md hover:bg-fuchsia-500 transition cursor-pointer hover:shadow-lg hover:shadow-fuchsia-400/20">
                    Submit API Request
                </button>
            </form>
        </div>
        
        <div class="p-8 bg-gray-900 rounded-lg mb-10 shadow-lg">
            <h2 class="text-xl font-semibold mb-6 text-fuchsia-400">Response</h2>
            <pre id="response" class="bg-gray-800 text-white rounded-md p-4 overflow-auto max-h-60">No response yet</pre>
        </div>
        
        <div class="p-8 bg-gray-900 rounded-lg shadow-lg">
            <h2 class="text-xl font-semibold mb-6 text-fuchsia-400">Link</h2>
            <div class="flex flex-col space-y-4">
                <div class="flex items-center space-x-2">
                    <input id="link-input" type="text" readonly class="flex-1 bg-gray-800 text-white rounded-md px-4 py-3 text-sm" placeholder="Generated link will appear here" value="">
                    <button id="copy-btn" class="copy-tooltip px-4 py-3 bg-violet-600 hover:bg-violet-700 text-white rounded-md transition cursor-pointer hover:shadow-lg hover:shadow-violet-600/20" disabled>
                        <span class="tooltiptext" id="copy-tooltip">Copy link</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer Section -->
    <footer class="py-10 text-center bg-black text-white mt-16">
        <div class="max-w-5xl mx-auto px-6">
            <p class="text-violet-500">© 2024 Hotel Chat AI. All rights reserved.</p>
        </div>
        
        <div class="flex justify-center space-x-6 mt-6">
            <a href="/quote" class="hover:underline text-fuchsia-400">Help</a>
            <a href="/quote" class="hover:underline text-fuchsia-400">Contact Us</a>
        </div>
    </footer>

    <!-- Custom Scripts -->
    <script>
        $(document).ready(function() {
            $('#create-bot-form').submit(function(e) {
                e.preventDefault();
                
                const password = $('#password').val();
                const botInput = $('#bot').val();
                
                // Handle bot as string or list based on comma separation
                let bot = botInput;
                if (botInput.includes(',')) {
                    bot = botInput.split(',').map(item => item.trim());
                }
                
                // Prepare the data
                const requestData = {
                    password: password,
                    bot: bot,
                };
                
                // Show loading indicator
                $('#response').text('Loading...');
                $('#link-input').val('');
                $('#copy-btn').prop('disabled', true);
                
                // Make the API call
                $.ajax({
                    url: 'https://messenger-hcai.fly.dev/messenger/auth/create-bot-secret',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(requestData),
                    success: function(response) {
                        console.log('Success:', response);
                        $('#response').text(JSON.stringify(response, null, 2));
                        const bot = encodeURIComponent(JSON.stringify(Object.keys(response)));
                        const bot_secret = encodeURIComponent(JSON.stringify(Object.values(response)));
                        const generatedLink = `${window.location.origin}/messenger/start?bot=${bot}&bot_secret=${bot_secret}`;
                        $('#link-input').val(generatedLink);
                        $('#copy-btn').prop('disabled', false);
                    },
                    error: function(xhr, status, error) {
                        console.error('Error:', xhr.responseText);
                        $('#response').text('Error: ' + xhr.responseText);
                        $('#link-input').val('');
                        $('#copy-btn').prop('disabled', true);
                    }
                });
            });
            
            // Copy to clipboard functionality
            $('#copy-btn').click(function() {
                const linkInput = $('#link-input');
                linkInput.select();
                document.execCommand('copy');
                
                // Change tooltip text
                $('#copy-tooltip').text('Copied!');
                
                // Reset tooltip text after 2 seconds
                setTimeout(function() {
                    $('#copy-tooltip').text('Copy link');
                }, 2000);
            });
        });
    </script>
</body>

</html>
